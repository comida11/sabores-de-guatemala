
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabores de Guatemala</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f1e5;color:#29231e}
header{text-align:center;background:white;padding:22px 10px}
header h1{color:#a52320;font-family:Georgia,serif;font-size:30px;margin:8px}
header p{color:#666;font-size:13px}
nav{display:flex;justify-content:space-around;background:white;padding:12px 3px;position:sticky;top:0}
nav button{border:0;background:#f5e8d9;padding:10px;border-radius:12px;color:#214b35;font-weight:bold}
.hero{padding:30px 20px;min-height:280px;border-radius:18px;color:white;background:linear-gradient(#0005,#000b),url('https://images.unsplash.com/photo-1512813195386-6cf811ad3542?w=1000') center/cover}
.hero h2{font-size:38px;font-family:Georgia,serif}
main{padding:15px;max-width:900px;margin:auto}
h2{color:#214b35}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.food{background:white;border-radius:15px;overflow:hidden;border:1px solid #eadfce}
.food img{width:100%;height:130px;object-fit:cover}
.food div{padding:10px}
.food h3{margin:0;color:#214b35;font-size:16px}
.food p{font-size:12px;color:#666}
.price{color:#a52320;font-weight:bold}
.add{background:#a52320;color:white;border:0;border-radius:9px;padding:9px 15px}
.page{display:none}
.page.active{display:block}
.btn{background:#a52320;color:white;border:0;border-radius:25px;padding:13px 20px;font-weight:bold}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.panel{background:white;border-radius:15px;padding:15px;margin:12px 0}
footer{background:#214b35;color:white;text-align:center;padding:25px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
